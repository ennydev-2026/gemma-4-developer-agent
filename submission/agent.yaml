# yaml-language-server: $schema=https://raw.githubusercontent.com/google/adk-python/refs/heads/main/src/google/adk/agents/config_schemas/AgentConfig.json
agent_class: LlmAgent
name: swe_root_agent
model: gemma-4-31b-it-qat-w4a16-ct
description: >-
  Graph-first autonomous software engineering agent for SWE-Bench-style Python
  issues. Uses harness tools plus an optional read-only code analyzer sub-agent.
instruction: !include prompts/system.md
generate_content_config: !include configs/sampling.yaml
tools:
  - name: run_command
  - name: read_file
  - name: edit_file
  - name: write_file
  - name: get_code_neighbors
  - name: search_similar_code
  - name: get_code_subgraph
  - name: get_status
  - name: submit_patch
  - name: run_skill_script
  - name: load_skill_resource
  - name: AgentTool
    args:
      agent:
        config_path: sub_agents/code_analyzer.yaml
      skip_summarization: false
