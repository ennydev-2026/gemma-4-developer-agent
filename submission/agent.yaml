agent_class: LlmAgent
name: trust_swe_agent
model: gemma-4-31b-it-qat-w4a16-ct
description: >-
  Reliability-aware software engineering agent that treats graph, lexical, and
  runtime evidence as fallible signals and repairs Python repositories.
instruction: !include prompts/system.md
generate_content_config: !include configs/sampling.yaml
tools:
  - run_command
  - read_file
  - edit_file
  - write_file
  - get_code_neighbors
  - search_similar_code
  - get_code_subgraph
  - get_status
  - submit_patch
  - agent_tool:
      config_path: sub_agents/code_analyzer.yaml
      skip_summarization: true
